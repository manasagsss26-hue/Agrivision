<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biochemical Analysis Report - AgriVision</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 60px;
      color: #f5f5f5;
      text-align: center;
      background: url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1600&q=80")
        no-repeat center center fixed;
      background-size: cover;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
    }

    h1 {
      font-size: 2.4rem;
      background: linear-gradient(90deg, #ffd700, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.1rem;
      color: #e0faff;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 15px 32px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      text-decoration: none;
      border-radius: 35px;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
      transition: 0.3s ease;
      margin: 10px;
    }

    .btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(0, 114, 255, 0.9);
    }

    /* Viewer box */
    .viewer {
      display: none;
      width: 90%;
      max-width: 900px;
      height: 550px;
      margin-top: 40px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      animation: fadeIn 0.6s ease;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    footer {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #a8ff78;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>🧪 Biochemical Analysis Report</h1>
  <p>Click the button below to download and view the detailed Plasma Biochemical Analysis report.</p>

  <!-- Combined Download + View Button -->
  <button id="viewBtn" class="btn">📄 Download & View PDF</button>

  <!-- Hidden download link -->
  <a id="downloadLink" href="biochemical_study.pdf" download style="display:none;"></a>

  <!-- PDF Viewer -->
  <div id="pdfViewer" class="viewer">
    <iframe id="pdfFrame" src=""></iframe>
  </div>

  <footer>© 2025 AgriVision | Designed by GSSSIETW</footer>

  <script>
    const viewBtn = document.getElementById("viewBtn");
    const downloadLink = document.getElementById("downloadLink");
    const pdfViewer = document.getElementById("pdfViewer");
    const pdfFrame = document.getElementById("pdfFrame");

    viewBtn.onclick = () => {
      downloadLink.click(); // Auto download
      pdfFrame.src = "biochemical_study.pdf"; // Show inside page
      pdfViewer.style.display = "block";
      pdfViewer.scrollIntoView({ behavior: "smooth" });
    };
  </script>

</body>
</html>
